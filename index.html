<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lưu trữ liên kết - aNotepad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 32px 28px;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .icon {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .icon svg {
            width: 56px;
            height: 56px;
            color: #2c7be5;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2b4c;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #6b7a8f;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .link-box {
            background: #f0f4fe;
            border: 1px solid #d0dff5;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .link-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2c7be5;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .link-url {
            font-size: 16px;
            font-weight: 500;
            color: #1a2b4c;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }
        .link-url:hover {
            color: #2c7be5;
            text-decoration: underline;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8a9bb5;
            border-top: 1px solid #e9eef6;
            padding-top: 18px;
            margin-top: 8px;
        }
        .btn-open {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2c7be5;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 10px;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(44, 123, 229, 0.25);
        }
        .btn-open:hover {
            background: #1a5bbf;
            box-shadow: 0 6px 16px rgba(44, 123, 229, 0.35);
        }
        .btn-open svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 22px;
        }
        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
            .meta {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Icon minh họa -->
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
            </svg>
        </div>

        <h1>Liên kết đã được lưu trữ</h1>
        <p class="subtitle">Trang ghi chú trực tuyến trên aNotepad</p>

        <!-- Khung hiển thị liên kết -->
        <div class="link-box">
            <div class="link-label">Địa chỉ liên kết</div>
            <a href="https://vi.anotepad.com/notes/e8atdsht" 
               class="link-url" 
               target="_blank" 
               rel="noopener noreferrer">
                https://vi.anotepad.com/notes/e8atdsht
            </a>
        </div>

        <!-- Nút mở liên kết -->
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="https://vi.anotepad.com/notes/e8atdsht" 
               class="btn-open" 
               target="_blank" 
               rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
                    <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
                </svg>
                Mở liên kết
            </a>
        </div>

        <!-- Thông tin bổ sung -->
        <div class="meta">
            <span>📌 Đã lưu vào: 23/11/2026</span>
            <span>🔗 Nguồn: anotepad.com</span>
        </div>

        <div class="footer">
            Trang lưu trữ liên kết – Nhấp vào nút phía trên để truy cập.
        </div>
    </div>
</body>
</html>
